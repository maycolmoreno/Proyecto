name: donaconnect

networks:
  donaconnect-network:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  n8n_data:

services:
  postgres:
    image: postgres:18.3-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: donaconnect
      POSTGRES_PASSWORD: donaconnect
      POSTGRES_DB: donaconnect
    ports:
      # 5433 en el host: evita conflicto si ya hay un PostgreSQL nativo escuchando en 5432.
      # La red interna de Docker sigue usando el puerto 5432 (postgres:5432, sin cambios).
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U donaconnect"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - donaconnect-network

  mongo:
    image: mongo:8.3.4
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - donaconnect-network

  n8n:
    image: n8nio/n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - donaconnect-network

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_POSTGRES_URL: postgresql://donaconnect:donaconnect@postgres:5432/donaconnect
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - donaconnect-network

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api/v1
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api
    networks:
      - donaconnect-network
